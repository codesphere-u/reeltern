<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Reeltern — Local Video Editing for People and Agents</title>
  <desc id="desc">Matte obsidian editing studio with Univer formula bar, blur_fill framing, Ken Burns motion, kinetic captions, 31 MCP tools, and verified exports.</desc>
