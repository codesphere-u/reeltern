[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "reeltern"
version = "0.1.0"
description = "Local video workflow orchestrator for eleven open-source tools"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
[project.optional-dependencies]
analysis = ["scenedetect>=0.6.4,<0.8", "librosa>=0.10,<0.12", "soundfile>=0.12"]
frames = ["color-matcher>=0.5,<0.6", "Pillow>=10", "rembg[cpu]>=2,<3"]
[project.scripts]
reeltern = "reeltern.cli:main"
[tool.setuptools.packages.find]
include = ["reeltern*"]
