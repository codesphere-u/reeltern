name: Release
on:
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'packaging/**'
      - 'scripts/build_release.py'
      - 'scripts/build_desktop_app.py'
      - 'scripts/smoke_bundle.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reeltern-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - id: version
        run: echo "value=$(cat release/version.txt)" >> "$GITHUB_OUTPUT"
      - run: python -m build
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  build_desktop:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - shell: bash
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          python -m pip install "dist/reeltern-${RELEASE_VERSION}-py3-none-any.whl[mcp]" pyinstaller
          rm -rf dist/*
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            xvfb-run -a python scripts/build_desktop_app.py --smoke-gui
          else
            python scripts/build_desktop_app.py --smoke
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-app-${{ matrix.os }}
          path: dist/Reeltern-Studio-*
          if-no-files-found: error

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - shell: bash
        run: python -m pip install "dist/reeltern-${{ needs.package.outputs.version }}-py3-none-any.whl[mcp]"
      - run: python -m unittest discover -s tests -v
      - if: matrix.python == '3.12'
        run: python scripts/check_docs.py
      - name: Install and exercise OS bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          case "$RUNNER_OS" in
            Windows) platform=windows ;;
            macOS) platform=macos ;;
            Linux) platform=linux ;;
          esac
          python scripts/smoke_bundle.py "dist/reeltern-${RELEASE_VERSION}-${platform}-python.zip"

  publish:
    needs: [package, build_desktop, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-app-*
          merge-multiple: true
          path: dist
      - name: Refresh checksums and publish verified preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum $(ls -1 | sort) > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --draft --prerelease --title "Reeltern ${RELEASE_VERSION} · Desktop Studio Apps, Antigravity MCP & AI Director" --notes-file "release/notes.md"
          gh release edit "$tag" --draft=false
