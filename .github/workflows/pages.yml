name: Deploy Reeltern Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/mcp-tools.json'
      - 'CHANGELOG.md'
      - 'scripts/sync_website_data.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published, released, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reeltern-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync MCP schemas and latest GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_website_data.py --fetch || python scripts/sync_website_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
